[package]
name = "flippy-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Identity-pinned native FIPS transport for Flippy"

[dependencies]
base64 = "0.22"
bech32 = "0.11"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.28"
url = "2"

[dev-dependencies]
hex = "0.4"
